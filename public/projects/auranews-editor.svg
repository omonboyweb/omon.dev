df8" font-family="ui-monospace, monospace" font-size="10">01 // AI STORY CLUSTERING QUEUE</text><text x="26" y="62" fill="#f8fafc" font-size="18" font-weight="700">Awaiting Editor Check</text><rect x="24" y="86" width="292" height="128" rx="12" fill="#1a2233" stroke="#fbbf24" stroke-width="1.8"/><rect x="40" y="102" width="168" height="20" rx="5" fill="#78350f" fill-opacity="0.65" stroke="#fbbf24"/><text x="124" y="116" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="9">FACT CONFLICT FLAGGED</text><text x="40" y="146" fill="#ffffff" font-size="13" font-weight="700">Yangi soliq imtiyozlari loyihasi</text><text x="40" y="166" fill="#cbd5e1" font-size="11">3 sources merged · 1 date mismatch</text><text x="40" y="192" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10">Inspecting draft →</text><rect x="24" y="230" width="292" height="106" rx="12" fill="#0d1320" stroke="#1e293b"/><rect x="40" y="246" width="96" height="18" rx="5" fill="#132522"/><text x="88" y="259" text-anchor="middle" fill="#34d399" font-family="ui-monospace, monospace" font-size="9">SOURCES MATCH</text><text x="40" y="286" fill="#f8fafc" font-size="13" font-weight="600">Tezyurar poyezd qatnovi jadvali</text><text x="40" y="308" fill="#94a3b8" font-size="11">4 sources verified · Ready</text><rect x="24" y="352" width="292" height="106" rx="12" fill="#0d1320" stroke="#1e293b"/><rect x="40" y="368" width="96" height="18" rx="5" fill="#132522"/><text x="88" y="381" text-anchor="middle" fill="#34d399" font-family="ui-monospace, monospace" font-size="9">SOURCES MATCH</text><text x="40" y="408" fill="#f8fafc" font-size="13" font-weight="600">Hududlarda IT akademiyalar</text><text x="40" y="430" fill="#94a3b8" font-size="11">2 sources verified · Ready</text><rect x="24" y="482" width="292" height="94" rx="12" fill="#0d1320" stroke="#28354d"/><text x="42" y="510" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">PIPELINE CYCLE</text><text x="42" y="532" fill="#e2e8f0" font-size="12">Har 30 daqiqada manbalar yig&apos;ilib,</text><text x="42" y="550" fill="#94a3b8" font-size="11">dublikatlar avtomatik birlashtiriladi</text></g><g transform="translate(454, 92)" filter="url(#editorShadow)" font-family="system-ui, -apple-system, sans-serif"><rect width="690" height="604" rx="18" fill="#111726" stroke="#263248" stroke-width="1.5"/><text x="28" y="36" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10">02 // FACT-CONFLICT DETECTOR &amp; EDITOR DESK</text><text x="28" y="64" fill="#f8fafc" font-size="19" font-weight="700">Yangi soliq imtiyozlari loyihasi muhokama qilindi</text><rect x="28" y="86" width="634" height="122" rx="14" fill="#261c0a" stroke="#fbbf24" stroke-width="1.5"/><text x="48" y="114" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">⚠ MANBALAR ORASIDAGI TAFAVUT (SOURCE CONFLICT ALERT)</text><text x="48" y="140" fill="#fef3c7" font-size="12">• Manba #1: Imtiyozlar 1-yanvardan kuchga kirishi (3 yil muddatga) ko&apos;rsatilgan.</text><text x="48" y="164" fill="#fef3c7" font-size="12">• Manba #2: Yakuniy ovoz berishdan so&apos;ng 1-martdan boshlanishi qayd etilgan.</text><text x="48" y="190" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10">Muharrir tekshiruvi: Chop etishdan oldin rasmiy sanani tasdiqlang.</text><rect x="28" y="226" width="634" height="154" rx="14" fill="#0d1320" stroke="#28354d"/><text x="48" y="254" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">TAYYORLANGAN 3 BANDLI QISQA XULOSA (LOTIN + КИРИЛЛ)</text><text x="48" y="282" fill="#e2e8f0" font-size="12">1. Texnologik korxonalar uchun soliq va bojxona yengilliklari paketi ko&apos;rib chiqildi.</text><text x="48" y="310" fill="#e2e8f0" font-size="12">2. Yangi tartib hududlarda yangi ish o&apos;rinlari yaratishni rag&apos;batlantiradi.</text><text x="48" y="338" fill="#e2e8f0" font-size="12">3. Rasmiy hujjat tasdiqlangach, aniq muddat e&apos;lon qilinadi.</text><text x="28" y="410" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">BIRIKTIRILGAN MANBALAR (CITED SOURCES)</text><rect x="28" y="424" width="200" height="36" rx="8" fill="#0d1320" stroke="#1e293b"/><text x="128" y="446" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">↗ Rasmiy axborot #1</text><rect x="244" y="424" width="200" height="36" rx="8" fill="#0d1320" stroke="#1e293b"/><text x="344" y="446" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">↗ Iqtisodiy sharh #2</text><rect x="460" y="424" width="202" height="36" rx="8" fill="#0d1320" stroke="#1e293b"/><text x="561" y="446" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">↗ Matbuot xizmati #3</text><line x1="28" y1="488" x2="662" y2="488" stroke="#1e293b"/><rect x="28" y="514" width="276" height="52" rx="12" fill="#10b981"/><text x="166" y="545" text-anchor="middle" fill="#06120e" font-size="13" font-weight="700">✓ Tasdiqlash (Sayt + Telegram)</text><rect x="320" y="514" width="168" height="52" rx="12" fill="#172033" stroke="#38bdf8" stroke-opacity="0.5"/><text x="404" y="545" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">✎ Tahrirlash</text><rect x="504" y="514" width="158" height="52" rx="12" fill="#261219" stroke="#f43f5e" stroke-opacity="0.5"/><text x="583" y="545" text-anchor="middle" fill="#fb7185" font-size="13" font-weight="600">✕ Rad etish</text></g></svg>